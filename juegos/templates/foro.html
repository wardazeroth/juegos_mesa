{% extends 'base.html' %}
{%block content%}
{%load static%}
    <div class="pt-3">
        <div class="marco">
            <a class="btn btn-primary mt-3" id="nuevo_post">Añadir un nuevo mensaje</a>
            <table class="table table-dark table-bordered border-primary mt-5">
                <tbody>
                    {%for post in posteos %}
                        <tr class="table-active">
                            <td><img src="{{ post.autor.usuario.avatar.url}}" class="img-foro" alt="foto_autor"></td>
                            <td><a href="{% url 'detalle_post' 'Post' post.id %}">{{ post.titulo }}</a><br>{{ post.autor.usuario.alias }}</td>
                            <td><a href="{% url 'categorias_group' post.categoria.id %}" class="btn btn-primary mt-3">{{ post.categoria}}</a></td>
                            <td> cantidad visitas </td>
                            <td> {{post.respuestas}} respuestas</td>
                        </tr>
                    {%endfor%}
                </tbody>
            </table>
        </div>        
    </div>
{%endblock%}
