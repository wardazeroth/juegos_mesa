{%extends 'base.html' %}
{%block content%}

<div class="pt-3">
    <div class="marco">
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <h3 class="text-center">Agregar un nuevo Local de juegos</h3>
                <form action="{% url 'nuevo_local' %}" method="post">
                    {%csrf_token%}
                    {%for field in form%}
                        <div class="mb-3">
                            {{ field.label_tag }}
                            {{ field }}
                        </div>
                    {%endfor%}
                    <input type="submit" value="Crear" class="btn btn-outline-primary text-center">
                </form>
            </div>
        </div>
    </div>
</div>

{%endblock%}
