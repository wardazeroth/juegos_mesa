services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
  
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    ports:
    - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning